<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Budsjette – personlig økonomi</title>
    <meta name="description" content="Hold oversikt over økonomien fra lønning til lønning. Budsjett, utgifter og analyse – rett i lomma." />

    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budsjette" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      // Sett tema før første maling for å unngå blink ved innlasting.
      (function () {
        try {
          var raw = localStorage.getItem('budsjette.v1');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme) theme = parsed.settings.theme;
          }
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* ignorer – appen setter tema etter oppstart */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Budsjette krever JavaScript for å fungere.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
